# Claude Code cloud sessions only: route builds and model downloads through the
# session's TLS-inspecting proxy. Elsewhere use compose.yaml alone.
#   docker compose -f compose.yaml -f .claude/compose.cloud.yaml run --rm embed ...
x-cloud: &cloud
  build:
    network: host
    secrets: [ca]
    args:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
  network_mode: host
  environment:
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
    SSL_CERT_FILE: /ca.crt
    REQUESTS_CA_BUNDLE: /ca.crt
  volumes:
    - /root/.ccr/ca-bundle.crt:/ca.crt:ro

services:
  test: *cloud
  embed: *cloud

secrets:
  ca:
    file: /root/.ccr/ca-bundle.crt
