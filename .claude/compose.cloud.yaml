# Claude Code cloud sessions only: build through the session's TLS-inspecting
# proxy. Elsewhere use compose.yaml alone.
#   docker compose -f compose.yaml -f .claude/compose.cloud.yaml run --rm app
services:
  app:
    build:
      network: host
      secrets: [ca]
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}

secrets:
  ca:
    file: /root/.ccr/ca-bundle.crt
