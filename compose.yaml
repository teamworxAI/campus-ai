# docker compose run --rm test        unit tests (no models)
# docker compose run --rm embed ...   anything that needs local embedding models
services:
  test:
    build: .
    image: campus-ai:test

  embed:
    build:
      context: .
      args:
        EXTRAS: embed
    image: campus-ai:embed
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/cache/huggingface
    command: ["python", "scripts/embed_bakeoff.py", "evals/embed/sample_bakeoff.jsonl"]

volumes:
  hf-cache:
