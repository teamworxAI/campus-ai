# docker compose build                    build the images (always first)
# docker compose run --rm test            unit tests (no models, no database)
# docker compose run --rm fetch-models    one-time download into MODELS_DIR (needs network)
# docker compose run --rm fetch-ollama    one-time LLM download into MODELS_DIR/ollama (needs network)
# docker compose run --rm fetch-europeana  Europeana items into DATA_DIR (needs network)
# docker compose run --rm fetch-course-docs  open course documents for the A6 gold set (needs network)
# docker compose run --rm fetch-openalex    an institution's researchers and works from OpenAlex (needs network)
# docker compose run --rm fetch-cordis      Horizon Europe projects and call topics (needs network)
# docker compose run --rm embed ...       local models + Neo4j, no internet access
# docker compose up -d web                collections search UI on http://localhost:8080,
#                                         Course Access review queue on http://localhost:8080/review/
# docker compose up -d ollama             local LLMs for the router (after fetch-ollama)
# docker compose run --rm smoke           local-stack smoke test (B1), report in evals/smoke/
#
# MODELS_DIR is a host directory that several projects can share. MODELS_DIR, DATA_DIR
# and NEO4J_DATA can point at another drive (e.g. D:) to keep large files off C:.
#
# Each image is built by exactly one service (`test`, `embed`); the others reuse it
# with `pull_policy: never`. Two services building one image in parallel corrupts it.

x-model-image: &model-image
  image: campus-ai:embed
  pull_policy: never

x-neo4j-env: &neo4j-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-campus-ai-local}

# For services that call the LLM router: Ollama in compose unless OLLAMA_URL is set
# (the team's inference box). The .env key is not OLLAMA_HOST because a native Ollama
# install exports that in the shell, and compose would pass the shell's value on.
x-llm-env: &llm-env
  OLLAMA_HOST: ${OLLAMA_URL:-http://ollama:11434}
  CAMPUS_AI_MODEL_REASONING: ${CAMPUS_AI_MODEL_REASONING:-}
  CAMPUS_AI_MODEL_VISION: ${CAMPUS_AI_MODEL_VISION:-}
  CAMPUS_AI_MODEL_CLASSIFICATION: ${CAMPUS_AI_MODEL_CLASSIFICATION:-}

services:
  # Unit tests, and the CPU-only image for the Course Access scripts (audit,
  # alt text). On the internal network so they reach Ollama and nothing outside.
  test:
    build: .
    image: campus-ai:test
    networks: [graph]
    environment: *llm-env
    volumes:
      - ${DATA_DIR:-./data}:/app/data:ro

  embed:
    build:
      context: .
      args:
        EXTRAS: embed
    image: campus-ai:embed
    # The graph network is internal: it reaches Neo4j and nothing else.
    networks: [graph]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      <<: [*neo4j-env, *llm-env]
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ${DATA_DIR:-./data}:/app/data:ro
    command: ["python", "scripts/embed_bakeoff.py", "evals/embed/sample_bakeoff.jsonl"]

  # Collections search API (R9): same image and isolation as embed.
  api:
    <<: *model-image
    restart: unless-stopped
    networks: [graph]
    depends_on:
      neo4j:
        condition: service_healthy
        restart: true
    environment:
      <<: [*neo4j-env, *llm-env]
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ${DATA_DIR:-./data}:/app/data:ro
    command: ["uvicorn", "campus_ai.research_assistant.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 6

  # Course Access review queue (P3): audit, proposals and the accessible rebuild for
  # uploaded course documents, which stay in the work volume on this machine. CPU-only
  # image; language and vision models come from `ollama` through the router.
  course-access:
    image: campus-ai:test
    pull_policy: never
    restart: unless-stopped
    networks: [graph]
    environment:
      <<: *llm-env
      WORK_DIR: /app/work
    volumes:
      - ${COURSE_ACCESS_WORK:-course-access-work}:/app/work
    command: ["uvicorn", "campus_ai.course_access.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/course-access/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

  # Static UI + reverse proxy. The only service with a published port; it holds
  # no model or data, and joins `edge` because an internal network can't publish.
  web:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    networks: [graph, edge]
    depends_on:
      api:
        condition: service_healthy
      course-access:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./web/static:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

  neo4j:
    image: neo4j:2026.09.0-community
    restart: unless-stopped
    networks: [graph]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-campus-ai-local}
    volumes:
      # A volume name (default) or a host folder, e.g. NEO4J_DATA=D:/campus-ai/neo4j
      - ${NEO4J_DATA:-neo4j-data}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      retries: 30

  # Local LLMs for the router (P9). Serves weights fetched by fetch-ollama, read-only,
  # on the internal network: no internet, so it cannot pull a model at runtime.
  ollama:
    image: ollama/ollama:0.40.8
    restart: unless-stopped
    networks: [graph]
    environment:
      OLLAMA_MODELS: /models/ollama
      OLLAMA_NOPRUNE: "1"  # never delete from the read-only weights
      OLLAMA_NO_CLOUD: "1"  # no Ollama cloud models (prime directive 2)
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 6

  fetch-models:
    <<: *model-image
    profiles: [fetch]
    environment:
      HF_HUB_OFFLINE: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MODELS_DIR:-./models}:/models
    command: ["python", "scripts/fetch_models.py"]

  # One-time pull of the router's default models (DEFAULT_MODELS in
  # campus_ai/core/llm/config.py) into MODELS_DIR/ollama. Pass other models as
  # arguments; each must be in MODEL_LICENCES.
  fetch-ollama:
    image: ollama/ollama:0.40.8
    profiles: [fetch]
    environment:
      OLLAMA_MODELS: /models/ollama
    volumes:
      - ${MODELS_DIR:-./models}:/models
    entrypoint:
      - sh
      - -c
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in "$$@"; do ollama pull "$$m" || exit 1; done
      - fetch-ollama
    command: ["gemma4:12b", "gemma4:e4b"]

  # One-time download of openly licensed course documents (PDF, PPTX, DOCX) for
  # the Course Access gold set (A6) into DATA_DIR/course_access, with a manifest
  # of sources and licences.
  fetch-course-docs:
    image: campus-ai:test
    pull_policy: never
    profiles: [fetch]
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["python", "scripts/fetch_course_docs.py"]
    command: []

  # One-time harvest of an institution's recent works from OpenAlex (CC0) into
  # DATA_DIR/openalex/<name>: researchers, publications, topics, SDGs for expert search.
  fetch-openalex:
    image: campus-ai:test
    pull_policy: never
    profiles: [fetch]
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["python", "scripts/fetch_openalex.py"]
    command: []

  # One-time download of Horizon Europe projects (CORDIS) and call topics (Funding &
  # Tenders), EU open data, into DATA_DIR/cordis/horizon for partner and call matching.
  fetch-cordis:
    image: campus-ai:test
    pull_policy: never
    profiles: [fetch]
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["python", "scripts/fetch_cordis.py"]
    command: []

  fetch-europeana:
    image: campus-ai:test
    pull_policy: never
    profiles: [fetch]
    environment:
      EUROPEANA_API_KEY: ${EUROPEANA_API_KEY:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["python", "scripts/fetch_europeana.py"]
    command: []

  # Local-stack smoke test (B1): every service up, no internet, router answers.
  # Start the stack first (docker compose up -d web ollama); writes evals/smoke/.
  smoke:
    image: campus-ai:test
    pull_policy: never
    profiles: [smoke]
    networks: [graph]
    environment: *llm-env
    volumes:
      - ./evals/smoke:/app/evals/smoke
    entrypoint: ["python", "scripts/smoke_test.py"]
    command: []

networks:
  graph:
    internal: true
  edge: {}

volumes:
  neo4j-data:
  course-access-work:
