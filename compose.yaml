# docker compose run --rm app                         unit tests
# docker compose run --rm app python scripts/...      scripts
# Models are served on the host by vLLM or Ollama and shared across projects;
# EMBED_BASE_URL points at the OpenAI-compatible endpoint (default: Ollama).
services:
  app:
    build: .
    image: campus-ai:app
    environment:
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - host.docker.internal:host-gateway
