[project]
name = "campus-ai"
version = "0.1.0"
description = "Agentic AI products for higher education in BC, Canada and the EU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.120",
    "httpx2>=1.0",
    "neo4j>=6.3.0",
    "anthropic[bedrock]>=1.11.0",
    "numpy>=2.4.6",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
embed = [
    "av>=18.1.0",
    "sentence-transformers[image,video]>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campus_ai"]

[dependency-groups]
dev = [
    "pypdf>=6.0",
    "reportlab>=4.4",
]
