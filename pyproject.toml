[project]
name = "campus-ai"
version = "0.1.0"
description = "Agentic AI products for higher education in BC, Canada and the EU"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic[bedrock]>=1.11.0",
    "numpy>=2.4.6",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
embed = [
    "av>=18.1.0",
    "sentence-transformers[image,video]>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campus_ai"]
