[project]
name = "campus-ai"
version = "0.1.0"
description = "Agentic AI products for higher education in BC, Canada and the EU"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic[bedrock]>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campus_ai"]
