# Front end for collections search (R9). Serves web/static and forwards /api and
# /media to the api service, which stays on the internal graph network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    server_tokens off;

    # Look the api up through Docker's DNS on every request (cached 10 s), so a
    # restarted api container with a new address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $course http://course-access:8000;

    # img-src allows blob: for the preview of an uploaded image.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    # No URI on proxy_pass: the client's request URI goes through unchanged
    # (item ids contain encoded slashes).
    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass $api;
    }

    # Course Access review queue (P3): uploads up to 50 MB; a document with many
    # images can take minutes when alt text is proposed.
    location /api/course-access/ {
        proxy_pass $course;
        client_max_body_size 50m;
        proxy_read_timeout 1800s;
    }
}
