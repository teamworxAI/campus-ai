# Front end for collections search (R9). Serves web/static and forwards /api and
# /media to the api service, which stays on the internal graph network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    # No URI on proxy_pass: the request URI goes through unchanged (item ids contain encoded slashes).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://api:8000;
    }
}
